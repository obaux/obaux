<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orb Hero</title>
<style>
  :root { --bg: #121317; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: #fff; }
  body { padding-top: env(safe-area-inset-top, 0px); }
  /* The hero is a 4:3 banner at the top of the page. */
  #hero { display: block; width: 100%; max-width: 560px; margin: 0 auto; aspect-ratio: 4 / 3; }
  .controls { display: flex; gap: 10px; justify-content: center; padding: 20px 16px; }
  .controls button {
    font: 600 14px/1 -apple-system, system-ui, sans-serif; color: #fff;
    background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.18);
    padding: 12px 20px; border-radius: 999px;
  }
  .controls button:active { background: rgba(255,255,255,.22); }
  #nogl { display: none; font: 15px system-ui; padding: 24px; }
</style>
</head>
<body>
<canvas id="hero" aria-hidden="true"></canvas>
<p id="nogl">WebGL2 isn't available on this device.</p>
<div class="controls">
  <button id="replay" type="button">Replay</button>
  <button id="exit" type="button">Exit</button>
</div>

<script>
/* ------------------------------------------------------------------ *
 *  OrbHero — WebGL2 circle-lattice entrance, no dependencies.
 *  Sized by its canvas: give the canvas a 4:3 box and it lays out to fit.
 *
 *  new OrbHero(canvas, {
 *    icons:   [...]   // slot 0 = centre circle, then outward. Each icon FILLS ITS
 *                     // CIRCLE (cover-fit). Entry = URL / data-URI string,
 *                     // <img>/<canvas>/ImageBitmap, or { path } (a 24×24 SVG
 *                     // path, drawn white on a coloured disc — placeholder art).
 *                     // Defaults to OrbHero.BUILTIN_ICONS.
 *    fill:    ['#2a2d36']  // disc colour behind { path } placeholders, cycled by slot
 *    rows:    [4, 5, 4]    // circles per row, top to bottom; the hero is the centre of the
 *                          // middle row (so it must be odd). Rows are centred: a hex lattice.
 *    empty:   [[0,0],[1,0],[1,4]]  // [row, column] of circles left empty (no icon)
 *    emptyFill: '#2a2d36'  // colour of an empty circle
 *    center:  [0.5, 0.5]   // hero centre, as a fraction of the canvas
 *    pitch:   0.195        // distance between neighbours, in canvas widths
 *    heroSize: 0.34        // peak hero radius, in canvas widths
 *    restSize: 0.09        // circle radius once the lattice is out (hero rests 12% larger)
 *    iconRes: 512          // px per icon layer (the hero peaks near 540 device px)
 *  })
 *  hero.play()   // entrance
 *  hero.exit()   // shrink everything away
 *  hero.seek(t)  // freeze at t seconds (debug / screenshots)
 * ------------------------------------------------------------------ */
class OrbHero {
  static BUILTIN_ICONS = [
    { path: 'M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM9 22V12h6v10' },                       // home
    { path: 'M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7z' }, // heart
    { path: 'M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.3-4.3' },                               // search
    { path: 'M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z' }, // star
    { path: 'M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0' },             // bell
    { path: 'M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z' },        // user
    { path: 'M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0zM12 13a3 3 0 1 0 0-6 3 3 0 0 0 0 6z' },   // pin
    { path: 'M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z' },                       // chat
    { path: 'M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3zM12 17a4 4 0 1 0 0-8 4 4 0 0 0 0 8z' }, // camera
    { path: 'M9 18V5l12-2v13M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0zM21 16a3 3 0 1 1-6 0 3 3 0 0 1 6 0z' }, // music
    { path: 'M13 2L3 14h9l-1 8 10-12h-9l1-8z' },                                                     // zap
  ];

  // Timeline, seconds (read off the reference recording).
  static T = {
    heroGrow: 1.15, heroShrinkEnd: 1.9,
    latticeStart: 1.2, latticeDur: 0.8, latticeStagger: 0.45,
    exitDur: 0.6, exitStagger: 0.35,
  };

  constructor(canvas, opts = {}) {
    this.canvas = canvas;
    this.opts = Object.assign({
      icons: OrbHero.BUILTIN_ICONS, center: [0.5, 0.5], fill: ['#2a2d36'],
      rows: [4, 5, 4], empty: [[0, 0], [1, 0], [1, 4]], emptyFill: '#2a2d36',
      pitch: 0.195, heroSize: 0.34, restSize: 0.09, startSize: 0.15, iconRes: 512, maxDpr: 2,
    }, opts);
    const gl = this.gl = canvas.getContext('webgl2', { alpha: true, premultipliedAlpha: true, antialias: false });
    if (!gl) throw new Error('WebGL2 unavailable');

    this.mode = 'in'; this.t0 = performance.now(); this.exitT0 = 0; this.frozen = null;
    this.reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

    this._initGL();
    this._ro = new ResizeObserver(() => this.resize());
    this._ro.observe(canvas);
    this.resize();
    this.ready = this._buildIcons(this.opts.icons).then(() => { this.play(); this._loop(); });
  }

  /* ---------------------------- GL setup --------------------------- */
  _initGL() {
    const gl = this.gl;
    const vs = `#version 300 es
      in vec2 aQuad; in vec4 aA; in vec4 aB;
      uniform vec2 uRes;
      out vec2 vUv; flat out vec4 vA; flat out vec4 vB;
      void main(){
        float ext = 1.06;
        vec2 px = aA.xy + aQuad * aA.z * ext;
        vec2 ndc = px / uRes * 2.0 - 1.0; ndc.y = -ndc.y;
        gl_Position = vec4(ndc, 0.0, 1.0);
        vUv = vec2(aQuad.x, -aQuad.y) * ext; vA = aA; vB = aB;   // y-up, matches screen after the flip above
      }`;
    // The icon is the circle: one layer of a texture array, mapped across the whole disc.
    // Coverage stays solid out to r = 1 and only feathers outside it, so the artwork's own
    // edge is never thinned (that thinning read as a faint ring).
    const fs = `#version 300 es
      precision highp float;
      in vec2 vUv; flat in vec4 vA; flat in vec4 vB;
      uniform highp sampler2DArray uIcons;
      out vec4 o;
      void main(){
        float r = length(vUv);
        float aa = 1.5 / vA.z;
        float cov = (1. - smoothstep(1., 1. + aa, r)) * vB.w;
        if (cov <= 0.) discard;
        vec2 tc = clamp(vec2(vUv.x, -vUv.y) * .5 + .5, 0., 1.);
        o = texture(uIcons, vec3(tc, vB.x)) * cov;   // premultiplied
      }`;
    const sh = (type, src) => {
      const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
      return s;
    };
    const prog = this.prog = gl.createProgram();
    gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs));
    gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
    gl.useProgram(prog);
    this.u = { uRes: gl.getUniformLocation(prog, 'uRes'), uIcons: gl.getUniformLocation(prog, 'uIcons') };

    this.vao = gl.createVertexArray(); gl.bindVertexArray(this.vao);
    const quad = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, quad);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
    const aQuad = gl.getAttribLocation(prog, 'aQuad');
    gl.enableVertexAttribArray(aQuad); gl.vertexAttribPointer(aQuad, 2, gl.FLOAT, false, 0, 0);

    this.inst = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, this.inst);
    for (const [name, off] of [['aA', 0], ['aB', 16]]) {
      const l = gl.getAttribLocation(prog, name);
      gl.enableVertexAttribArray(l); gl.vertexAttribPointer(l, 4, gl.FLOAT, false, 32, off);
      gl.vertexAttribDivisor(l, 1);
    }
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    gl.clearColor(0, 0, 0, 0);
  }

  /* ----------------------------- icons ----------------------------- */
  // One texture-array layer per icon. Layers can't bleed into each other the way
  // neighbouring cells of a shared atlas do, and each layer mipmaps on its own.
  async _buildIcons(icons) {
    const gl = this.gl, n = icons.length, R = this.opts.iconRes;
    this.slots = n;
    const cv = document.createElement('canvas'); cv.width = cv.height = R;
    const ctx = cv.getContext('2d');

    const tex = this.tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D_ARRAY, tex);
    gl.texStorage3D(gl.TEXTURE_2D_ARRAY, Math.floor(Math.log2(R)) + 1, gl.RGBA8, R, R, n + 1);   // +1: the empty circle
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);

    for (let i = 0; i < n; i++) {
      ctx.clearRect(0, 0, R, R);
      const src = icons[i];
      if (src && src.path) {
        // Placeholder: a full disc with a white glyph at half size.
        ctx.fillStyle = this.opts.fill[i % this.opts.fill.length];
        ctx.beginPath(); ctx.arc(R / 2, R / 2, R / 2, 0, Math.PI * 2); ctx.fill();
        const s = (R * 0.5) / 24;
        ctx.save(); ctx.translate(R * 0.25, R * 0.25); ctx.scale(s, s);
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.7; ctx.lineCap = ctx.lineJoin = 'round';
        ctx.stroke(new Path2D(src.path)); ctx.restore();
      } else {
        // Supplied art fills the circle: cover-fit, centred.
        const img = typeof src === 'string' ? await OrbHero._loadImage(src) : src;
        const w = img.width || img.naturalWidth, h = img.height || img.naturalHeight;
        const k = Math.max(R / w, R / h);
        ctx.drawImage(img, (R - w * k) / 2, (R - h * k) / 2, w * k, h * k);
      }
      gl.texSubImage3D(gl.TEXTURE_2D_ARRAY, 0, 0, 0, i, R, R, 1, gl.RGBA, gl.UNSIGNED_BYTE, cv);
    }
    // Last layer: a plain disc, for circles left empty.
    ctx.clearRect(0, 0, R, R);
    ctx.fillStyle = this.opts.emptyFill;
    ctx.beginPath(); ctx.arc(R / 2, R / 2, R / 2, 0, Math.PI * 2); ctx.fill();
    gl.texSubImage3D(gl.TEXTURE_2D_ARRAY, 0, 0, 0, n, R, R, 1, gl.RGBA, gl.UNSIGNED_BYTE, cv);

    gl.generateMipmap(gl.TEXTURE_2D_ARRAY);
    gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    this._layout();
  }
  static _loadImage(url) {
    return new Promise((res, rej) => {
      const i = new Image(); i.crossOrigin = 'anonymous';
      i.onload = () => res(i); i.onerror = () => rej(new Error('icon failed: ' + url)); i.src = url;
    });
  }

  /* ----------------------------- layout ---------------------------- */
  // Explicit rows, each centred, so the lattice is exactly symmetric. Row spacing is the
  // hex one (pitch * 0.87); the hero is the centre circle of the middle row.
  _layout() {
    if (!this.slots) return;
    const { pitch, restSize, rows, empty } = this.opts;
    const dy = pitch * 0.87, mid = (rows.length - 1) / 2;
    let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

    const orbs = [];
    rows.forEach((n, j) => {
      for (let i = 0; i < n; i++) {
        if (j === mid && i === (n - 1) / 2) continue;   // the hero
        const x = (i - (n - 1) / 2) * pitch, y = (j - mid) * dy;
        orbs.push({ x, y, d: Math.hypot(x, y), r: restSize, phase: rnd() * 6.283,
                    empty: empty.some(([a, b]) => a === j && b === i) });
      }
    });
    orbs.sort((a, b) => a.d - b.d);
    let k = 0;
    for (const o of orbs) {
      o.slot = o.empty ? this.slots : (this.slots > 1 ? 1 + (k++ % (this.slots - 1)) : 0);
    }
    this.orbs = orbs; this.maxD = orbs.length ? orbs[orbs.length - 1].d : 1;
    this.data = new Float32Array((orbs.length + 1) * 8);
  }

  resize() {
    const dpr = Math.min(devicePixelRatio || 1, this.opts.maxDpr);
    const W = Math.max(1, Math.round(this.canvas.clientWidth * dpr));
    const H = Math.max(1, Math.round(this.canvas.clientHeight * dpr));
    if (W === this.W && H === this.H) return;
    this.W = W; this.H = H;
    this.canvas.width = W; this.canvas.height = H;
    this.gl.viewport(0, 0, W, H);
    this._layout();
  }

  /* ---------------------------- animation -------------------------- */
  play() { this.mode = 'in'; this.t0 = performance.now(); this.frozen = null; }
  exit() { if (this.mode !== 'out') { this.mode = 'out'; this.exitT0 = performance.now(); } }
  seek(t, exitT) { this.frozen = { t, exitT: exitT ?? null }; }

  static ease = {
    outCubic: x => 1 - Math.pow(1 - x, 3),
    inCubic: x => x * x * x,
    inOutCubic: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
    outBack: x => { const c1 = 1.2, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  };

  _frame(now) {
    const gl = this.gl, T = OrbHero.T, E = OrbHero.ease, o = this.opts;
    const clamp01 = x => Math.min(1, Math.max(0, x));
    const lerp = (a, b, k) => a + (b - a) * k;

    let t = (now - this.t0) / 1000;
    let exitT = this.mode === 'out' ? (now - this.exitT0) / 1000 : -1;
    if (this.frozen) { t = this.frozen.t; exitT = this.frozen.exitT ?? -1; }
    if (this.reduceMotion && !this.frozen) t = 10;   // jump to the finished layout
    const clock = this.reduceMotion ? 0 : now / 1000;

    const W = this.W;
    const ccx = o.center[0] * W, ccy = o.center[1] * this.H;
    const out = d => {                               // exit multiplier: outer first, hero last
      if (exitT < 0) return 1;
      const delay = (this.maxD - d) / this.maxD * T.exitStagger;
      return 1 - E.inCubic(clamp01((exitT - delay) / T.exitDur));
    };

    let n = 0; const D = this.data;
    const push = (x, y, r, slot) => {
      if (r * W < 0.6) return;
      D.set([x, y, r * W, 0, slot, 0, 0, 1], n * 8); n++;
    };

    for (const orb of this.orbs) {
      const k = clamp01((t - (T.latticeStart + orb.d * T.latticeStagger)) / T.latticeDur);
      if (k <= 0) continue;
      const e = E.outCubic(k), s = E.outBack(k) * out(orb.d);
      const bob = t > 2.4 ? Math.sin(clock * 0.9 + orb.phase) * 0.006 : 0;
      push(ccx + orb.x * e * W, ccy + (orb.y * e + bob) * W, orb.r * s, orb.slot);
    }

    // Hero last so it sits above everything during the hand-off.
    let hr;
    if (t < T.heroGrow) hr = lerp(o.startSize, o.heroSize, E.outCubic(t / T.heroGrow));
    else hr = lerp(o.heroSize, o.restSize * 1.12, E.inOutCubic(clamp01((t - T.heroGrow) / (T.heroShrinkEnd - T.heroGrow))));
    hr *= exitT < 0 ? 1 : Math.max(0, 1 - E.inCubic(clamp01((exitT - T.exitStagger) / T.exitDur)));
    push(ccx, ccy, hr, 0);

    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.useProgram(this.prog); gl.bindVertexArray(this.vao);
    gl.bindBuffer(gl.ARRAY_BUFFER, this.inst);
    gl.bufferData(gl.ARRAY_BUFFER, D.subarray(0, n * 8), gl.DYNAMIC_DRAW);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D_ARRAY, this.tex);
    gl.uniform1i(this.u.uIcons, 0);
    gl.uniform2f(this.u.uRes, this.W, this.H);
    gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, n);
  }
  _loop() {
    const tick = now => { this._frame(now); this._raf = requestAnimationFrame(tick); };
    this._raf = requestAnimationFrame(tick);
  }

  destroy() { cancelAnimationFrame(this._raf); this._ro.disconnect(); }
}

/* ------------------------------ demo -------------------------------- */
try {
  const hero = new OrbHero(document.getElementById('hero'));
  window.hero = hero;
  document.getElementById('replay').onclick = () => hero.play();
  document.getElementById('exit').onclick = () => hero.exit();
  const q = new URLSearchParams(location.search);
  if (q.has('t')) hero.ready.then(() => hero.seek(parseFloat(q.get('t')), q.has('x') ? parseFloat(q.get('x')) : null));
} catch (err) {
  console.error(err);
  document.getElementById('hero').style.display = 'none';
  document.getElementById('nogl').style.display = 'block';
}
</script>
</body>
</html>

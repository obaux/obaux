<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dimension gauge demo</title>
<!-- Serve this folder over HTTP (ES modules don't load from file://):  python3 -m http.server  -->
<style>
  body{margin:0;padding:32px 16px;background:#000230;color:#fff;font:15px system-ui,sans-serif}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:28px 16px;max-width:760px;margin:0 auto}
  .cell{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
  .cell span{font-size:13px;opacity:.8}

  /* THEMING: this is the whole color story. Point --dg-color at your design-system token. */
  dimension-gauge{--dg-size:112px;--dg-color:#4561de}
  /* Per-dimension color is just a different value on that element. */
  .cell.alt dimension-gauge{--dg-color:#1f9d8a}

  p{text-align:center;margin-top:32px}
  button{font:inherit;padding:8px 14px;border-radius:8px;border:0;background:#4561de;color:#fff;cursor:pointer}
  #log{max-width:760px;margin:20px auto 0;font:12px ui-monospace,monospace;opacity:.7;text-align:center;min-height:1.4em}
</style>

<div class="grid" id="grid"></div>
<p><button id="replay">Replay</button></p>
<div id="log"></div>

<script type="module">
  import './dimension-gauge.js';
  import { scoreDimension, gaugeProps } from './likert.js';

  // Placeholder icons (Lucide-style, 24px stroke). Swap for your icon set; any inline <svg slot="icon"> works.
  const ic = p => `<svg slot="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
  const dims = [   // [name, Likert answers 1–5, icon paths]. Placeholders: the real ten dimensions were not provided.
    ['Housing',   [3, 4, 2, 4], '<path d="M3 11 12 3l9 8"/><path d="M5 10v10h14V10"/>'],
    ['Health',    [4, 4, 5, 3], '<path d="M20.8 5.6a5.5 5.5 0 0 0-7.8 0L12 6.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 22l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/>'],
    ['Income',    [2, 2, 3, 2], '<circle cx="12" cy="12" r="9"/><path d="M14.5 9a2.5 2 0 0 0-2.5-1.5c-1.5 0-2.5.8-2.5 2s1 1.7 2.5 2 2.5.8 2.5 2-1 2-2.5 2A2.5 2 0 0 1 9.5 15M12 6v1.5M12 16.5V18"/>'],
    ['Community', [4, 5, 4, 4], '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>'],
    ['Learning',  [5, 5, 5, 5], '<path d="M2 9l10-5 10 5-10 5-10-5Z"/><path d="M6 11.5V16c0 1.5 3 3 6 3s6-1.5 6-3v-4.5"/>'],
  ];

  const grid = document.getElementById('grid'), log = document.getElementById('log');
  grid.innerHTML = dims.map(([name, answers, icon], i) => {
    const props = gaugeProps(scoreDimension(answers));          // { value, energy }
    return `<div class="cell ${i % 2 ? 'alt' : ''}">
      <dimension-gauge value="${props.value}" energy="${props.energy}" delay="${i * 320}" label="${name}">${ic(icon)}</dimension-gauge>
      <span>${name}</span></div>`;
  }).join('');

  // Events bubble from every gauge: use fillend to reveal a number or caption after the water settles.
  grid.addEventListener('fillend', e => { log.textContent = `${e.target.getAttribute('label')} finished at ${e.detail.value}`; });

  // replay() empties a gauge and runs its first fill again.
  document.getElementById('replay').onclick = () => grid.querySelectorAll('dimension-gauge').forEach(g => g.replay());
</script>

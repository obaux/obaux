<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arch Glow</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font: 12px/1.3 system-ui, sans-serif; }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  canvas { display: block; }
  #panel {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); width: 300px; max-height: 70%; overflow: auto;
    padding: 12px; border-radius: 10px; background: rgba(20,18,20,.82); color: #eee;
    backdrop-filter: blur(8px); transition: opacity .2s;
  }
  #panel.hidden { opacity: 0; pointer-events: none; transform: translate(-50%, 16px); }
  #panel { transition: opacity .2s, transform .25s; }
  #panel h2 { margin: 0 0 8px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #aaa; }
  .row { display: flex; align-items: center; justify-content: space-between; margin: 5px 0; }
  .row input[type=color] { width: 36px; height: 22px; padding: 0; border: 0; background: none; cursor: pointer; }
  .row input[type=range] { width: 110px; }
  button { background: #333; color: #eee; border: 0; border-radius: 6px; padding: 5px 9px; cursor: pointer; margin: 6px 6px 0 0; }
  button:hover { background: #444; }
  #toggle {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 5; margin: 0; padding: 8px 14px; font-size: 13px;
    background: rgba(20,18,20,.72); backdrop-filter: blur(8px); touch-action: manipulation;
  }
  #toggle.open { opacity: 0; pointer-events: none; }
  canvas { touch-action: none; }
  #panel { touch-action: pan-y; z-index: 6; }
  #panel .close { float: right; margin: -4px 0 0; padding: 4px 10px; }
  .row input[type=color] { width: 44px; height: 28px; }
  @media (max-width: 640px) {
    #panel { left: 0; right: 0; bottom: 0; transform: none; width: auto; max-height: 62%; border-radius: 14px 14px 0 0; padding: 14px 16px 22px; }
    #panel.hidden { transform: translateY(100%); }
    #toggle { bottom: 20px; }
    #panel { transition: opacity .2s, transform .25s; }
    .row input[type=range] { width: 55%; }
    #hint { display: none; }
  }
  #hint { position: fixed; left: 12px; bottom: 10px; color: #ffffff66; }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<button id="toggle" type="button">Colors</button>
<div id="panel"></div>
<div id="hint">press C to toggle controls · space to pause · drag to push the glow</div>

<script id="fs" type="x-shader/x-fragment">
precision highp float;
uniform vec2  uRes;
uniform float uTime;      // seconds (already scaled by speed on the JS side)
uniform float uMotion;    // 0 = static, 1 = full motion amplitude
uniform vec2  uPointer;   // 0..1, smoothed touch / mouse position
uniform float uPress;     // 0..1, eased while pressing

// palette -----------------------------------------------------------
uniform vec3 uBg;         // dark backdrop
uniform vec3 uGlowRed;    // side glow
uniform vec3 uGlowOrange; // bottom glow
uniform vec3 uEdgeGlow;   // magenta rim beside the stem
uniform vec3 uTop;        // green cap
uniform vec3 uYellow;     // pale yellow bands + centre line
uniform vec3 uPink;       // salmon ring
uniform vec3 uTan;        // warm edge where the green fades out
uniform vec3 uBlobA;      // lower body: pink / lavender
uniform vec3 uBlobB;      // lower body: yellow-green
uniform vec3 uBlobC;      // lower body: green-teal
uniform vec3 uBlobD;      // lower body: blue-grey
uniform vec3 uBase;       // lower body base wash

const float CX    = 0.5;
const float R     = 0.21;   // arch radius
const float TOP_Y = 0.753;  // centre of the top semicircle
const float BOT_Y = 0.243;  // centre of the bottom semicircle

float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }

// signed distance to a vertical capsule
float capsule(vec2 p, float r) {
  float y = clamp(p.y, BOT_Y, TOP_Y);
  return length(vec2(p.x - CX, p.y - y)) - r;
}

vec3 blob(vec3 acc, inout float wsum, vec2 p, vec2 c, float r, vec3 col) {
  vec2 d = p - (c + (uPointer - 0.5) * 0.3);
  float w = exp(-dot(d, d) / (r * r));
  wsum += w;
  return acc + col * w;
}

void main() {
  vec2 p = gl_FragCoord.xy / uRes;     // 0..1, y up (canvas is square)
  float t = uTime * uMotion;

  // ---- arch: slight breathing ------------------------------------
  float r = R + 0.004 * sin(t * 0.8) * uMotion;
  float sdf = capsule(p, r);

  // ---- banded pattern radiating from the spine --------------------
  float yTop = min(p.y, TOP_Y);
  float d = length(vec2(p.x - CX, p.y - yTop)) / r;
  // slow travelling ripple along the bands
  d += uMotion * 0.035 * sin(p.y * 7.0 - t * 1.4) * smoothstep(0.2, 0.9, p.y);
  d += uMotion * 0.02  * sin(d * 9.0 - t * 1.1);

  float pr = length(p - uPointer);
  d += 0.05 * uPress * sin(pr * 20.0 - t * 3.0) * exp(-pr * 3.5);

  vec3 pat = uYellow;
  pat = mix(pat, uPink,   smoothstep(0.03, 0.22, d));
  pat = mix(pat, uYellow, smoothstep(0.36, 0.66, d));
  vec3 edge = mix(uTan, uTop, smoothstep(0.45, 0.78, p.y));
  pat = mix(pat, edge,    smoothstep(0.68, 0.98, d));

  // ---- lower body: soft drifting colour blobs ---------------------
  float ws = 0.12;
  vec3 acc = uBase * ws;
  acc = blob(acc, ws, p, vec2(0.37 + 0.03 * sin(t * 0.7),       0.25 + 0.03 * cos(t * 0.5)), 0.17, uBlobA);
  acc = blob(acc, ws, p, vec2(0.58 + 0.03 * cos(t * 0.6),       0.38 + 0.03 * sin(t * 0.8)), 0.16, uBlobB);
  acc = blob(acc, ws, p, vec2(0.58 + 0.035 * sin(t * 0.9 + 1.), 0.14 + 0.03 * cos(t * 0.7)), 0.14, uBlobC);
  acc = blob(acc, ws, p, vec2(0.52 + 0.03 * cos(t * 0.5 + 2.),  0.06 + 0.02 * sin(t * 0.9)), 0.12, uBlobD);
  vec3 body = acc / ws;

  float patMask = smoothstep(0.36, 0.60, p.y);
  vec3 bodyCol = mix(body, pat, patMask);

  // body edge: razor sharp up top, melting away toward the bottom
  float soft = mix(0.0025, 0.055, smoothstep(0.66, 0.22, p.y));
  float mask = 1.0 - smoothstep(-soft, soft, sdf);

  // ---- backdrop ---------------------------------------------------
  float dx = abs(p.x - CX);
  float up = smoothstep(0.66, 0.12, p.y + 0.10 * dx);        // glow strength, grows downward
  vec3 glow = mix(uGlowRed, uGlowOrange, smoothstep(0.34, 0.04, p.y));
  vec3 bg = mix(uBg, glow, up);
  // vignette in the lower corners
  bg *= 1.0 - 0.3 * smoothstep(0.40, 0.75, length(p - vec2(0.5, 0.25)));

  // rim glow hugging the stem
  float rimY = smoothstep(0.30, 0.42, p.y) * smoothstep(0.62, 0.50, p.y);
  float rim = exp(-max(sdf, 0.0) * 14.0) * rimY;
  bg = mix(bg, uEdgeGlow, rim * 0.85);
  bg = max(bg, uBg);

  vec3 col = mix(bg, bodyCol, mask);

  // dither to hide banding in the big gradients
  col += (hash(gl_FragCoord.xy + fract(uTime)) - 0.5) / 255.0;
  gl_FragColor = vec4(col, 1.0);
}
</script>

<script>
// ===================================================================
//  Palette — every key becomes a colour picker and a shader uniform.
//  Edit here, use the panel, or call  art.setColors({ uTop: '#ff0' })
// ===================================================================
const PALETTE = {
  uBg:         '#110c0e',
  uGlowRed:    '#c43c47',
  uGlowOrange: '#c8703e',
  uEdgeGlow:   '#d44ab8',
  uTop:        '#7ff04f',
  uYellow:     '#e4ee9c',
  uPink:       '#dc939c',
  uTan:        '#d9b070',
  uBlobA:      '#da8fd2',
  uBlobB:      '#dfe58f',
  uBlobC:      '#86cfa0',
  uBlobD:      '#a9b9c9',
  uBase:       '#dcc0b4',
};
const LABELS = {
  uBg: 'Background', uGlowRed: 'Glow · red', uGlowOrange: 'Glow · orange', uEdgeGlow: 'Rim glow',
  uTop: 'Cap green', uYellow: 'Bands yellow', uPink: 'Ring pink', uTan: 'Edge tan',
  uBlobA: 'Body · pink', uBlobB: 'Body · yellow', uBlobC: 'Body · green', uBlobD: 'Body · blue', uBase: 'Body base',
};

// ---------------------------------------------------------------- GL
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl', { antialias: true, preserveDrawingBuffer: true });
const compile = (type, src) => {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
};
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, 'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}'));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, document.getElementById('fs').textContent));
gl.linkProgram(prog); gl.useProgram(prog);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'a');
gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const U = n => gl.getUniformLocation(prog, n);

const hex2rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255);
const state = { speed: 1, motion: 1, playing: true, time: 0, px: .5, py: .5, tx: .5, ty: .5, press: 0, tpress: 0 };
const params = new URLSearchParams(location.search);
if (params.has('t'))      { state.time = +params.get('t'); }
if (params.has('motion')) { state.motion = +params.get('motion'); }

function resize() {
  const s = Math.min(innerWidth, innerHeight), dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.style.width = canvas.style.height = s + 'px';
  canvas.width = canvas.height = Math.round(s * dpr);
  gl.viewport(0, 0, canvas.width, canvas.height);
}
addEventListener('resize', resize); resize();

function draw() {
  gl.uniform2f(U('uRes'), canvas.width, canvas.height);
  gl.uniform1f(U('uTime'), state.time);
  gl.uniform1f(U('uMotion'), state.motion);
  gl.uniform2f(U('uPointer'), state.px, state.py);
  gl.uniform1f(U('uPress'), state.press);
  for (const k in PALETTE) gl.uniform3fv(U(k), hex2rgb(PALETTE[k]));
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}
let last = performance.now();
(function frame(now) {
  if (state.playing) state.time += (now - last) / 1000 * state.speed;
  state.px += (state.tx - state.px) * .1; state.py += (state.ty - state.py) * .1; state.press += (state.tpress - state.press) * .12;
  last = now; draw(); requestAnimationFrame(frame);
})(last);

// ---------------------------------------------------------- pointer
const setPointer = e => {
  const r = canvas.getBoundingClientRect();
  state.tx = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  state.ty = Math.min(1, Math.max(0, 1 - (e.clientY - r.top) / r.height));
};
canvas.addEventListener('pointerdown', e => { canvas.setPointerCapture(e.pointerId); setPointer(e); state.tpress = 1; });
canvas.addEventListener('pointermove', e => { if (e.pointerType === 'mouse' || state.tpress) setPointer(e); });
const release = () => { state.tpress = 0; state.tx = state.ty = .5; };
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', release);
canvas.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') release(); });

// ------------------------------------------------------------- panel
const panel = document.getElementById('panel');
panel.innerHTML = '<button class="close" id="close" type="button">Done</button><h2>Colours</h2>';
const inputs = {};
for (const k in PALETTE) {
  const row = document.createElement('label'); row.className = 'row';
  row.innerHTML = `<span>${LABELS[k]}</span><input type="color" value="${PALETTE[k]}">`;
  const inp = row.querySelector('input'); inputs[k] = inp;
  inp.addEventListener('input', () => { PALETTE[k] = inp.value; });
  panel.appendChild(row);
}
panel.insertAdjacentHTML('beforeend', `<h2 style="margin-top:12px">Motion</h2>
  <div class="row"><span>Amount</span><input id="motion" type="range" min="0" max="2" step=".05" value="${state.motion}"></div>
  <div class="row"><span>Speed</span><input id="speed" type="range" min="0" max="3" step=".05" value="${state.speed}"></div>
  <button id="pause">Pause</button><button id="png">Save PNG</button>`);
panel.querySelector('#motion').oninput = e => state.motion = +e.target.value;
panel.querySelector('#speed').oninput  = e => state.speed  = +e.target.value;
const pauseBtn = panel.querySelector('#pause');
const togglePlay = () => { state.playing = !state.playing; pauseBtn.textContent = state.playing ? 'Pause' : 'Play'; };
pauseBtn.onclick = togglePlay;
panel.querySelector('#png').onclick = () => {
  draw(); const a = document.createElement('a'); a.download = 'arch-glow.png'; a.href = canvas.toDataURL('image/png'); a.click();
};
const toggleBtn = document.getElementById('toggle');
const setPanel = open => { panel.classList.toggle('hidden', !open); toggleBtn.classList.toggle('open', open); };
toggleBtn.onclick = () => setPanel(true);
panel.querySelector('#close').onclick = () => setPanel(false);
setPanel(innerWidth > 640);   // closed by default on phones
addEventListener('keydown', e => {
  if (e.key === 'c' || e.key === 'C') setPanel(panel.classList.contains('hidden'));
  if (e.key === ' ') { e.preventDefault(); togglePlay(); }
});
if (params.has('clean')) { setPanel(false); toggleBtn.remove(); document.getElementById('hint').remove(); }

// ------------------------------------------------------- public API
window.art = {
  state, PALETTE,
  setColors(map) { for (const k in map) if (k in PALETTE) { PALETTE[k] = map[k]; if (inputs[k]) inputs[k].value = map[k]; } },
  setSpeed(v)  { state.speed = v; },
  setMotion(v) { state.motion = v; },
  play()  { state.playing = true; },
  pause() { state.playing = false; },
};
</script>
</body>
</html>

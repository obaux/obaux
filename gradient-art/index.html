<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Breath Guide</title>
<style>
  html { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font: 12px/1.3 system-ui, sans-serif; }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  canvas { display: block; touch-action: none; }

  /* breath cue, centred in the sphere; ink colour follows the Background swatch */
  #guide {
    position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: .15em;
    pointer-events: none; color: var(--ink, #110c0e); text-align: center;
  }
  #phase { font-size: clamp(12px, 2.3vmin, 20px); font-weight: 600; letter-spacing: .14em; text-transform: uppercase; opacity: .78; }
  #count { font-size: clamp(30px, 8vmin, 68px); font-weight: 300; line-height: 1; font-variant-numeric: tabular-nums; opacity: .85; }

  #guide[data-ink=light] { color: #fff; text-shadow: 0 1px 14px rgba(0,0,0,.45); }
  #guide[data-pos=below] { inset: calc(50% + min(100vw, 100vh) * 0.25) 0 0 0; place-content: start center; }   /* sits just under the artwork, wherever the screen is tall */
  #guide[data-pos=below] #count { font-size: clamp(28px, 6vmin, 52px); }
  #panel {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); width: 300px; max-height: 70%; overflow: auto;
    padding: 12px; border-radius: 10px; background: rgba(20,18,20,.82); color: #eee;
    backdrop-filter: blur(8px); transition: opacity .2s, transform .25s; touch-action: pan-y; z-index: 6;
  }
  #panel.hidden { opacity: 0; pointer-events: none; transform: translate(-50%, 16px); }
  #panel h2 { margin: 0 0 8px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #aaa; }
  #panel .close { float: right; margin: -4px 0 0; padding: 4px 10px; }
  .row { display: flex; align-items: center; justify-content: space-between; margin: 5px 0; }
  .row input[type=color] { width: 44px; height: 28px; padding: 0; border: 0; background: none; cursor: pointer; }
  .row input[type=range] { width: 110px; }
  .row input[type=checkbox] { width: 20px; height: 20px; accent-color: #fff; }
  select { background: #333; color: #eee; border: 0; border-radius: 6px; padding: 6px 8px; font: inherit; max-width: 170px; }
  button { background: #333; color: #eee; border: 0; border-radius: 6px; padding: 5px 9px; cursor: pointer; margin: 6px 6px 0 0; }
  button:hover { background: #444; }
  #hint { position: fixed; left: 12px; bottom: 10px; color: #ffffff66; }
  @media (max-width: 640px) {
    #panel { left: 0; right: 0; bottom: 0; transform: none; width: auto; max-height: 62%; border-radius: 14px 14px 0 0; padding: 14px 16px 22px; }
    #panel.hidden { transform: translateY(100%); }
    .row input[type=range] { width: 55%; }
    #hint { display: none; }
  }
  /* bottom dock: style switcher + controls button, clear of the viewer's top bar */
  #dock {
    position: fixed; left: 0; right: 0; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 5;
    display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0 16px;
    pointer-events: none; transition: opacity .2s;
  }
  #dock > * { pointer-events: auto; }
  #dock.open { opacity: 0; }
  #dock.open > * { pointer-events: none; }
  #styles { display: flex; gap: 4px; padding: 4px; max-width: 100%; box-sizing: border-box; overflow-x: auto; border-radius: 999px; background: rgba(20,18,20,.6); backdrop-filter: blur(8px); scrollbar-width: none; }
  #styles::-webkit-scrollbar { display: none; }
  #styles button { margin: 0; min-height: 44px; padding: 0 16px; border-radius: 999px; background: transparent; font-size: 14px; flex: 0 0 auto; touch-action: manipulation; }
  #styles button.active { background: rgba(255,255,255,.2); }
  #toggle { margin: 0; min-height: 44px; padding: 0 24px; border-radius: 999px; font-size: 14px; background: rgba(20,18,20,.72); backdrop-filter: blur(8px); touch-action: manipulation; }
  @media (max-width: 440px) {
    #dock { padding: 0 12px; }
    #styles button { padding: 0 10px; font-size: 13px; }
  }
  @media (pointer: coarse), (max-width: 640px) {
    #panel { padding-bottom: calc(22px + env(safe-area-inset-bottom, 0px)); }
    #panel button { min-height: 44px; padding: 0 18px; font-size: 14px; }
    #panel select { min-height: 44px; font-size: 15px; max-width: 62%; }
    #panel .row { min-height: 48px; margin: 2px 0; font-size: 14px; }
    #panel .row input[type=color] { width: 56px; height: 40px; }
    #panel .row input[type=range] { height: 44px; width: 55%; accent-color: #fff; }
    #panel h2 { font-size: 12px; margin-bottom: 4px; }
    #panel input[type=checkbox] { width: 28px; height: 28px; }
  }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div id="guide" aria-live="off"><div id="phase">Breathe in</div><div id="count">4</div></div>
<div id="dock"><div id="styles"></div><button id="toggle" type="button">Controls</button></div>
<div id="panel"></div>
<div id="hint">press C for controls · 1–4 switch style · space to pause</div>

<script id="fs" type="x-shader/x-fragment">
precision highp float;
uniform vec2  uRes;
uniform float uTime;      // seconds (already scaled by speed on the JS side)
uniform float uMotion;    // 0 = still colour, 1 = full liquid flow inside the sphere
uniform float uBreath;    // 0 = fully exhaled (small), 1 = fully inhaled (large)
uniform vec2  uPointer;   // 0..1, smoothed touch / mouse position
uniform float uPress;     // 0..1, eased while pressing

// palette -----------------------------------------------------------
uniform vec3 uBg;         // dark backdrop
uniform vec3 uGlowRed;    // side glow
uniform vec3 uGlowOrange; // bottom glow
uniform vec3 uEdgeGlow;   // magenta halo around the sphere
uniform vec3 uTop;        // green rim
uniform vec3 uYellow;     // pale yellow bands + core
uniform vec3 uPink;       // salmon ring
uniform vec3 uTan;        // warm edge where the green fades out
uniform vec3 uBlobA;      // lower body: pink / lavender
uniform vec3 uBlobB;      // lower body: yellow-green
uniform vec3 uBlobC;      // lower body: green-teal
uniform vec3 uBlobD;      // lower body: blue-grey
uniform vec3 uBase;       // lower body base wash
uniform vec3 uHighlight;  // glassy edge shine, liquid specular, guide ring
uniform float uGlass;     // 0 = flat, 1 = full refraction / shine
uniform float uStyle;     // 0 sphere · 1 bloom · 2 horizon · 3 lotus
uniform float uSquare;    // 0 = circle, 1 = squircle (box breathing)
uniform vec3  uTrail[24]; // tracker: xy = position (uv), z = brightness; [0] is the head, the rest trail behind

const vec2  C    = vec2(0.5, 0.5);   // sphere centre
const float RMIN = 0.19;             // radius when fully exhaled
const float RMAX = 0.30;             // radius when fully inhaled
const float R0   = 0.27;             // reference radius the interior picture is drawn at

float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }

float vnoise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  f = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
  float a = hash(i), b = hash(i + vec2(1.0, 0.0)), c = hash(i + vec2(0.0, 1.0)), d = hash(i + vec2(1.0, 1.0));
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}

float fbm(vec2 p) {
  float s = 0.0, a = 0.5;
  for (int i = 0; i < 3; i++) { s += a * vnoise(p); p = p * 2.03 + vec2(17.1, 9.7); a *= 0.5; }
  return s;
}

vec2 rot(vec2 v, float a) { float s = sin(a), c = cos(a); return vec2(c * v.x - s * v.y, s * v.x + c * v.y); }

float sstep(float a, float b, float x) {          // quintic: no visible kinks where bands meet
  float t = clamp((x - a) / (b - a), 0.0, 1.0);
  return t * t * t * (t * (t * 6.0 - 15.0) + 10.0);
}

vec3 bands(float d, vec3 edge) {
  vec3 c = mix(uYellow, uPink, sstep(0.0, 0.27, d));
  c = mix(c, uYellow, sstep(0.28, 0.76, d));
  return mix(c, edge, sstep(0.60, 1.02, d));
}

vec3 blob(vec3 acc, inout float wsum, vec2 p, vec2 c, float r, vec3 col) {
  vec2 d = p - (c + (uPointer - 0.5) * 0.3);
  float w = exp(-dot(d, d) / (r * r));
  wsum += w;
  return acc + col * w;
}

// distance-like measure: a circle at uSquare = 0, a squircle with app-icon corners at 1
float sqLen(vec2 v) {
  float n = mix(2.0, 5.0, uSquare);
  vec2 a = abs(v) + 1e-5;
  return pow(pow(a.x, n) + pow(a.y, n), 1.0 / n);
}

// ===== style 0: sphere — a perfect circle that grows and shrinks =====
vec3 styleSphere(vec2 p) {
  float t = uTime * uMotion;

  // ---- outline: a perfect circle whose radius follows the breath ----
  vec2 v = p - C;
  float n = mix(2.0, 5.0, uSquare);
  vec2 av = abs(v) + 1e-5;
  float len = pow(pow(av.x, n) + pow(av.y, n), 1.0 / n);
  vec2 gv = vec2(sign(v.x) * pow(av.x, n - 1.0), sign(v.y) * pow(av.y, n - 1.0)) / pow(len, n - 1.0);
  float gm = length(gv);
  vec2 nrm = gv / gm;                                   // outward normal
  float r = mix(RMIN, RMAX, uBreath) * mix(1.0, 0.93, uSquare);   // squircle trimmed to match the circle's visual size
  float sdf = (len - r) / gm;                           // approx. distance to the edge

  // ---- interior: the same picture, scaled with the sphere ----------
  vec2 vi = v * (R0 / r);
  float k = 1.0 - clamp(len / r, 0.0, 1.0);
  vec2 q = C + rot(vi, k * 1.6 * sin(t * 0.35) * uMotion);
  vec2 wq = q * 2.2;
  vec2 wv = vec2(fbm(wq + vec2(0.0, t * 0.15)), fbm(wq + vec2(5.2, -t * 0.12))) - 0.44;
  q += wv * 0.13;

  float pr = length(p - uPointer);
  float d = sqLen(q - (C + vec2(0.0, 0.05))) / R0;   // colour bands follow the outline: round for a circle, squared for the squircle
  d += uMotion * 0.02 * sin(d * 9.0 - t * 1.1);
  d += 0.05 * uPress * sin(pr * 20.0 - t * 3.0) * exp(-pr * 3.5);

  // glass lens: bands bunch toward the rim, and R/G/B split slightly there
  d = pow(clamp(d, 0.0, 1.2), 1.0 - 0.25 * uGlass);
  float ca = 0.035 * uGlass * smoothstep(0.45, 1.0, d);
  vec3 edgeC = mix(uTan, uTop, smoothstep(0.40, 0.72, q.y));
  vec3 pat = vec3(bands(d * (1.0 - ca), edgeC).r, bands(d, edgeC).g, bands(d * (1.0 + ca), edgeC).b);

  // lower body: soft colour blobs
  float ws = 0.12;
  vec3 acc = uBase * ws;
  acc = blob(acc, ws, q, vec2(0.40 + 0.04 * sin(t * 0.7),        0.40 + 0.04 * cos(t * 0.5)), 0.17, uBlobA);
  acc = blob(acc, ws, q, vec2(0.62 + 0.04 * cos(t * 0.6),        0.52 + 0.04 * sin(t * 0.8)), 0.16, uBlobB);
  acc = blob(acc, ws, q, vec2(0.58 + 0.04 * sin(t * 0.9 + 1.0),  0.33 + 0.03 * cos(t * 0.7)), 0.14, uBlobC);
  acc = blob(acc, ws, q, vec2(0.48 + 0.04 * cos(t * 0.5 + 2.0),  0.27 + 0.03 * sin(t * 0.9)), 0.12, uBlobD);
  vec3 body = acc / ws;

  vec3 bodyCol = mix(body, pat, sstep(0.34, 0.64, q.y));

  // glossy surface: height field from noise -> normal -> soft specular
  vec2 hq = q * 3.0 + t * 0.1;
  float h0 = fbm(hq), hx = fbm(hq + vec2(0.03, 0.0)), hy = fbm(hq + vec2(0.0, 0.03));
  vec3 n3 = normalize(vec3(-(hx - h0) / 0.03 * 0.3, -(hy - h0) / 0.03 * 0.3, 1.0));
  vec3 H = normalize(vec3(-0.4, 0.6, 0.7) + vec3(0.0, 0.0, 1.0));
  float spec = pow(max(dot(n3, H), 0.0), 28.0);
  bodyCol += uHighlight * spec * 0.14 * uGlass;

  // clean antialiased edge, about 1.5 px
  float soft = max(0.003, 1.5 / uRes.y);
  float mask = 1.0 - smoothstep(-soft, soft, sdf);

  // ---- backdrop ----------------------------------------------------
  // refraction: the glow bends around the glass, with standing ripples off the edge
  vec2 pw = p - nrm * 0.035 * uGlass * exp(-max(sdf, 0.0) * 12.0);
  float rip = sin(sdf * 62.0 + sin(p.y * 7.0 + t * 0.4) * 1.6 - t * 1.6) * exp(-max(sdf, 0.0) * 7.0) * smoothstep(0.0, 0.012, sdf);
  float dx = abs(pw.x - C.x);
  float up = min(smoothstep(0.66, 0.12, pw.y + 0.10 * dx) * (0.85 + 0.30 * uBreath), 1.0);   // glow swells with the inhale
  vec3 glow = mix(uGlowRed, uGlowOrange, smoothstep(0.34, 0.04, pw.y));
  vec3 bg = mix(uBg, glow, up);
  bg *= 1.0 - 0.3 * smoothstep(0.40, 0.75, length(p - vec2(0.5, 0.25)));

  // halo around the sphere, brighter when full
  float rimY = smoothstep(0.26, 0.40, p.y) * smoothstep(0.66, 0.52, p.y);
  float rim = exp(-max(sdf, 0.0) * 14.0) * rimY;
  bg = mix(bg, uEdgeGlow, rim * 0.85);
  bg = mix(bg, uEdgeGlow, 0.22 * uBreath * exp(-max(sdf, 0.0) * 9.0));
  bg += uGlowRed * 0.04 * uGlass * rip * (0.4 + up);
  bg = max(bg, uBg);

  vec3 col = mix(bg, bodyCol, mask);

  // specular rim on the lit (upper-left) side, faint inner shade opposite
  float inside = max(-sdf, 0.0);
  float inMask = smoothstep(0.0, 0.006, -sdf);
  float lit = pow(max(dot(nrm, normalize(vec2(-0.55, 0.8))), 0.0), 2.5);
  float zone = smoothstep(0.30, 0.62, p.y);
  col += uHighlight * exp(-inside * 110.0) * inMask * lit * zone * 0.8 * uGlass;
  col *= 1.0 - 0.18 * uGlass * exp(-inside * 45.0) * inMask * (1.0 - lit) * zone;

  return col;
}

// the warm glow from the original image, shared by the styles below
vec3 backdrop(vec2 p) {
  float up = min(smoothstep(0.66, 0.12, p.y + 0.10 * abs(p.x - C.x)) * (0.85 + 0.30 * uBreath), 1.0);
  vec3 glow = mix(uGlowRed, uGlowOrange, smoothstep(0.34, 0.04, p.y));
  return mix(uBg, glow, up) * (1.0 - 0.3 * smoothstep(0.40, 0.75, length(p - vec2(0.5, 0.25))));
}

// ===== style 1: bloom — the green ball never moves; the colours inside breathe =====
vec3 styleBloom(vec2 p) {
  float t = uTime * uMotion;
  vec2 v = p - C;
  float sq = mix(1.0, 0.93, uSquare);
  float len = sqLen(v) / sq;
  vec2 w = vec2(fbm(p * 2.0 + vec2(0.0, t * 0.12)), fbm(p * 2.0 + vec2(5.2, -t * 0.10))) - 0.44;
  float dn = sqLen(v + w * 0.10 * uMotion) / (0.30 * sq);      // 0 at the centre, 1 at the nominal edge
  float d = dn / mix(0.42, 1.0, uBreath);                 // exhale: colours gather in; inhale: they spread out

  vec3 c = mix(uYellow, uPink, sstep(0.0, 0.50, d));
  c = mix(c, uYellow, sstep(0.38, 1.00, d));
  c = mix(c, uTop,    sstep(0.80, 1.45, d));
  c += uHighlight * 0.14 * uBreath * exp(-dn * dn * 5.0);

  vec3 bg = backdrop(p);
  bg = mix(bg, uTop * 0.55, 0.20 * (0.5 + 0.5 * uBreath) * exp(-max(len - 0.30, 0.0) * 9.0));
  float mask = 1.0 - smoothstep(0.55, 1.05, dn);          // wide feather: no outline anywhere
  return mix(bg, c, mask);
}

// ===== style 2: horizon — a sun rises on the inhale and sets on the exhale =====
vec3 styleHorizon(vec2 p) {
  float t = uTime * uMotion;
  const float HY = 0.24;
  float sunR = mix(0.15, 0.22, uBreath);
  vec2 sc = vec2(0.5, mix(0.14, 0.52, uBreath));
  float ds = length(p - sc);

  float skyK = smoothstep(0.85, HY, p.y);
  vec3 sky = mix(uBg, mix(uGlowRed, uGlowOrange, smoothstep(0.55, HY, p.y)), skyK * (0.35 + 0.65 * uBreath));
  sky = mix(sky, uGlowOrange, exp(-ds * ds / 0.12) * (0.30 + 0.55 * uBreath));
  vec3 sunC = mix(uYellow, uPink, smoothstep(0.0, sunR, ds));
  sky = mix(sky, sunC, 1.0 - smoothstep(sunR * 0.55, sunR, ds));

  float below = smoothstep(0.0, HY, p.y);
  vec3 water = mix(uBg * 0.8, mix(uGlowRed, uGlowOrange, 0.5) * 0.45, below);
  float spread = 0.04 + 0.12 * (HY - p.y);
  float refl = exp(-pow((p.x - 0.5) / spread, 2.0)) * (0.25 + 0.75 * uBreath) * below;
  refl *= 0.55 + 0.45 * sin(p.y * 140.0 - t * 2.0 + sin(p.x * 22.0) * 2.0);
  water += mix(uGlowOrange, uYellow, 0.5) * refl * 0.6;

  float land = 1.0 - smoothstep(HY - 1.5 / uRes.y, HY + 1.5 / uRes.y, p.y);
  vec3 col = mix(sky, water, land);
  col += uHighlight * 0.18 * (0.3 + 0.7 * uBreath) * exp(-abs(p.y - HY) * uRes.y / 1.4);
  return col;
}

// ===== style 3: lotus — three rings of petals open and close =====
vec3 styleLotus(vec2 p) {
  float t = uTime * uMotion;
  vec2 v = p - vec2(0.5, 0.56);
  float len = length(v);
  float open = uBreath;
  vec3 col = mix(uBg, backdrop(p), 0.6);
  float gr = mix(0.12, 0.20, open);
  col = 1.0 - (1.0 - col) * (1.0 - uTop * 0.22 * exp(-len * len / (gr * gr)));          // soft glow behind the flower
  float rotA = t * 0.08 + open * 0.6;
  for (int layer = 0; layer < 3; layer++) {              // outer green, then pink, then yellow on top
    float fl = float(layer);
    float cd = mix(0.02, 0.15 - 0.045 * fl, open);        // petal centre distance
    float L  = mix(0.055, 0.11 - 0.025 * fl, open);       // half length
    float Wd = mix(0.045, 0.075 - 0.010 * fl, open);      // half width
    vec3 pc = fl < 0.5 ? uTop : fl < 1.5 ? uPink : uYellow;
    float a0 = rotA * (1.0 - 0.5 * fl) + fl * 0.3927;
    for (int k = 0; k < 8; k++) {
      float a = a0 + float(k) * 0.785398;
      vec2 dk = vec2(cos(a), sin(a));
      float u = dot(v, dk) - cd, w2 = dot(v, vec2(-dk.y, dk.x));
      float e = exp(-(u * u) / (L * L) - (w2 * w2) / (Wd * Wd));
      col = mix(col, pc, smoothstep(0.08, 0.65, e) * 0.92);
    }
  }
  return col;
}

void main() {
  vec2 p = gl_FragCoord.xy / uRes;     // 0..1, y up (canvas is square)
  vec3 col;
  if      (uStyle < 0.5) col = styleSphere(p);
  else if (uStyle < 1.5) col = styleBloom(p);
  else if (uStyle < 2.5) col = styleHorizon(p);
  else                   col = styleLotus(p);

  // tracker: a dot with a comet trail that circles the outline once per breath cycle
  for (int j = 0; j < 24; j++) {
    vec3 tj = uTrail[j];
    vec2 dv = p - tj.xy;
    float fall = 1.0 - float(j) / 24.0;
    col += uHighlight * tj.z * fall * fall * 0.34 * exp(-dot(dv, dv) / 0.00016);
  }
  float dh = length(p - uTrail[0].xy);
  col = mix(col, vec3(1.0), uTrail[0].z * (1.0 - smoothstep(0.008, 0.013, dh)));

  // dither to hide banding in the big gradients
  col += (hash(gl_FragCoord.xy + fract(uTime)) + hash(gl_FragCoord.yx + 7.3 + fract(uTime * 1.7)) - 1.0) / 255.0;
  gl_FragColor = vec4(col, 1.0);
}
</script>

<script>
// ===================================================================
//  Palette — every key becomes a colour picker and a shader uniform.
//  Edit here, use the panel, or call  art.setColors({ uTop: '#ff0' })
// ===================================================================
const PALETTE = {
  uBg:         '#110c0e',
  uGlowRed:    '#c43c47',
  uGlowOrange: '#c8703e',
  uEdgeGlow:   '#d44ab8',
  uTop:        '#7ff04f',
  uYellow:     '#e4ee9c',
  uPink:       '#dc939c',
  uTan:        '#d9b070',
  uBlobA:      '#da8fd2',
  uBlobB:      '#dfe58f',
  uBlobC:      '#86cfa0',
  uBlobD:      '#a9b9c9',
  uBase:       '#dcc0b4',
  uHighlight:  '#ffffff',
};
const LABELS = {
  uBg: 'Background', uGlowRed: 'Glow · red', uGlowOrange: 'Glow · orange', uEdgeGlow: 'Halo',
  uTop: 'Rim green', uYellow: 'Bands yellow', uPink: 'Ring pink', uTan: 'Edge tan',
  uBlobA: 'Body · pink', uBlobB: 'Body · yellow', uBlobC: 'Body · green', uBlobD: 'Body · blue', uBase: 'Body base', uHighlight: 'Shine',
};

// ===================================================================
//  Breathing patterns — seconds per phase, in order.
//  kind: in (grow) · out (shrink) · full (hold inhaled) · empty (hold exhaled)
// ===================================================================
const PATTERNS = {
  calm:      { label: 'Calm · in 4, out 6',      phases: [['in', 4], ['out', 6]] },
  coherent:  { label: 'Coherent · 5.5 / 5.5',    phases: [['in', 5.5], ['out', 5.5]] },
  relax:     { label: 'Relax · 4-7-8',           phases: [['in', 4], ['full', 7], ['out', 8]] },
  box:       { label: 'Box · 4-4-4-4',           phases: [['in', 4], ['full', 4], ['out', 4], ['empty', 4]], shape: 'squircle' },
};
const CUES = { in: 'Breathe in', out: 'Breathe out', full: 'Hold', empty: 'Hold' };
const STYLES = {
  sphere:  { label: 'Sphere',  ink: 'dark',  pos: 'center' },   // perfect circle, grows and shrinks
  bloom:   { label: 'Bloom',   ink: 'dark',  pos: 'center' },   // fixed soft green ball, colours breathe inside
  horizon: { label: 'Horizon', ink: 'light', pos: 'below'  },   // sun rises and sets
  lotus:   { label: 'Lotus',   ink: 'light', pos: 'below'  },   // petals open and close
};
const ease = u => 0.5 - 0.5 * Math.cos(Math.PI * u);      // slow start, slow finish, like a real breath

// returns { v: 0..1 sphere size, kind, left: whole seconds remaining, cycle }
function breathAt(pattern, clock) {
  const total = pattern.phases.reduce((s, p) => s + p[1], 0);
  let tt = clock % total;
  for (let idx = 0; idx < pattern.phases.length; idx++) {
    const [kind, dur] = pattern.phases[idx];
    if (tt < dur) {
      const u = tt / dur;
      const v = kind === 'in' ? ease(u) : kind === 'out' ? 1 - ease(u) : kind === 'full' ? 1 : 0;
      return { v, kind, left: Math.max(1, Math.ceil(dur - tt - 1e-6)), cycle: Math.floor(clock / total) + 1, idx, u };
    }
    tt -= dur;
  }
  return { v: 0, kind: 'empty', left: 1, cycle: 1, idx: 0, u: 0 };
}

// Tracker: a dot with a comet trail that circles the outline once per breath cycle at a steady pace.
// Points sit on the same curve the shader draws (|x|^n + |y|^n = 1, n = 2 circle .. 5 squircle),
// walked by arc length from the bottom-left, clockwise. It dims during holds and brightens for in / out.
const TRAIL = 24, TRAIL_STEP = 0.006;
const trailBuf = new Float32Array(TRAIL * 3);
function trackerTrail(b) {
  trailBuf.fill(0);
  if (!state.tracker || (state.style !== 'sphere' && state.style !== 'bloom')) return trailBuf;
  const e = 2 / (2 + 3 * state.sq), N = 240, pts = [], cum = [0];
  for (let i = 0; i <= N; i++) {
    const th = (225 - i * 360 / N) * Math.PI / 180, c = Math.cos(th), s = Math.sin(th);
    pts.push([Math.sign(c) * Math.abs(c) ** e, Math.sign(s) * Math.abs(s) ** e]);
    if (i) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  }
  const sqf = 1 - 0.07 * state.sq;
  // sphere: its own outline. bloom: the edge of the colour layer, which scales with the breath (the green ball stays put)
  const R = state.style === 'sphere' ? (0.19 + 0.11 * b.v) * sqf : 0.30 * sqf * 0.85 * (0.42 + 0.58 * b.v);
  const total = PATTERNS[state.pattern].phases.reduce((a, p) => a + p[1], 0);
  const f0 = (state.clock % total) / total;
  for (let j = 0; j < TRAIL; j++) {
    const target = (((f0 - j * TRAIL_STEP) % 1) + 1) % 1 * cum[N];
    let lo = 0, hi = N;
    while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (cum[mid] <= target) lo = mid; else hi = mid; }
    const k = (target - cum[lo]) / ((cum[hi] - cum[lo]) || 1);
    trailBuf[j * 3]     = 0.5 + R * (pts[lo][0] + (pts[hi][0] - pts[lo][0]) * k);
    trailBuf[j * 3 + 1] = 0.5 + R * (pts[lo][1] + (pts[hi][1] - pts[lo][1]) * k);
    trailBuf[j * 3 + 2] = state.tb;
  }
  return trailBuf;
}

// ---------------------------------------------------------------- GL
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl', { antialias: true, preserveDrawingBuffer: true });
const compile = (type, src) => {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
};
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, 'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}'));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, document.getElementById('fs').textContent));
gl.linkProgram(prog); gl.useProgram(prog);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'a');
gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const U = n => gl.getUniformLocation(prog, n);

const hex2rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255);
const state = {
  speed: 1, motion: 0.45, glass: 0.7,              // look of the colour flow inside the sphere
  playing: true, time: 0, clock: 0, pattern: 'calm', style: 'bloom', // clock = seconds of breathing, independent of flow speed
  px: .5, py: .5, tx: .5, ty: .5, press: 0, tpress: 0, sq: 0, tracker: true, tb: 1,   // sq eases 0 (circle) to 1 (squircle)
};
const params = new URLSearchParams(location.search);
if (params.has('t'))       state.clock = +params.get('t');      // jump to a moment in the breath cycle
if (params.has('motion'))  state.motion = +params.get('motion');
if (params.has('glass'))   state.glass = +params.get('glass');
if (params.has('style') && STYLES[params.get('style')]) state.style = params.get('style');
if (params.has('pattern') && PATTERNS[params.get('pattern')]) state.pattern = params.get('pattern');

const squareTarget = () => PATTERNS[state.pattern].shape === 'squircle' ? 1 : 0;
state.sq = squareTarget();

function resize() {
  const s = Math.min(innerWidth, innerHeight), dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.style.width = canvas.style.height = s + 'px';
  canvas.width = canvas.height = Math.round(s * dpr);
  gl.viewport(0, 0, canvas.width, canvas.height);
}
addEventListener('resize', resize); resize();

const phaseEl = document.getElementById('phase'), countEl = document.getElementById('count');
let shown = '';
function updateGuide(b) {
  const key = b.kind + b.left;
  if (key === shown) return;
  shown = key; phaseEl.textContent = CUES[b.kind]; countEl.textContent = b.left;
}

function draw(b) {
  gl.uniform2f(U('uRes'), canvas.width, canvas.height);
  gl.uniform1f(U('uTime'), state.time);
  gl.uniform1f(U('uMotion'), state.motion);
  gl.uniform1f(U('uGlass'), state.glass);
  gl.uniform1f(U('uBreath'), b.v);
  gl.uniform1f(U('uSquare'), state.sq);
  gl.uniform3fv(U('uTrail'), trackerTrail(b));
  gl.uniform1f(U('uStyle'), Object.keys(STYLES).indexOf(state.style));
  gl.uniform2f(U('uPointer'), state.px, state.py);
  gl.uniform1f(U('uPress'), state.press);
  for (const k in PALETTE) gl.uniform3fv(U(k), hex2rgb(PALETTE[k]));
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}
let last = performance.now();
(function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  if (state.playing) { state.time += dt * state.speed; state.clock += dt; }
  const k = 1 - Math.exp(-dt * 7);
  state.px += (state.tx - state.px) * k; state.py += (state.ty - state.py) * k; state.press += (state.tpress - state.press) * k;
  state.sq += (squareTarget() - state.sq) * (1 - Math.exp(-dt * 4));
  last = now;
  const b = breathAt(PATTERNS[state.pattern], state.clock);
  state.tb += ((b.kind === 'full' || b.kind === 'empty' ? 0.25 : 1) - state.tb) * (1 - Math.exp(-dt * 5));   // dim on holds, bright on in / out
  updateGuide(b); draw(b); requestAnimationFrame(frame);
})(last);

// ---------------------------------------------------------- pointer
const setPointer = e => {
  const r = canvas.getBoundingClientRect();
  state.tx = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  state.ty = Math.min(1, Math.max(0, 1 - (e.clientY - r.top) / r.height));
};
canvas.addEventListener('pointerdown', e => { canvas.setPointerCapture(e.pointerId); setPointer(e); state.tpress = 1; });
canvas.addEventListener('pointermove', e => { if (e.pointerType === 'mouse' || state.tpress) setPointer(e); });
const release = () => { state.tpress = 0; state.tx = state.ty = .5; };
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', release);
canvas.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') release(); });

// ------------------------------------------------------------- panel
const panel = document.getElementById('panel');
const setInk = () => document.documentElement.style.setProperty('--ink', PALETTE.uBg);
setInk();
panel.innerHTML = `<button class="close" id="close" type="button">Done</button><h2>Breathing</h2>
  <div class="row"><span>Pattern</span><select id="pattern">${
    Object.entries(PATTERNS).map(([k, p]) => `<option value="${k}">${p.label}</option>`).join('')}</select></div>
  <label class="row"><span>Tracker dot</span><input type="checkbox" id="tracker" checked></label>
  <button id="restart" type="button">Restart</button><button id="pause" type="button">Pause</button>
  <h2 style="margin-top:14px">Colours</h2>`;
const inputs = {};
for (const k in PALETTE) {
  const row = document.createElement('label'); row.className = 'row';
  row.innerHTML = `<span>${LABELS[k]}</span><input type="color" value="${PALETTE[k]}">`;
  const inp = row.querySelector('input'); inputs[k] = inp;
  inp.addEventListener('input', () => { PALETTE[k] = inp.value; setInk(); });
  panel.appendChild(row);
}
panel.insertAdjacentHTML('beforeend', `<h2 style="margin-top:12px">Colour flow</h2>
  <div class="row"><span>Amount</span><input id="motion" type="range" min="0" max="2" step=".05" value="${state.motion}"></div>
  <div class="row"><span>Glass (sphere)</span><input id="glass" type="range" min="0" max="1.5" step=".05" value="${state.glass}"></div>
  <div class="row"><span>Speed</span><input id="speed" type="range" min="0" max="3" step=".05" value="${state.speed}"></div>
  <button id="png" type="button">Save PNG</button>`);
const patternSel = panel.querySelector('#pattern');
patternSel.value = state.pattern;
patternSel.onchange = () => { state.pattern = patternSel.value; state.clock = 0; };
panel.querySelector('#tracker').onchange = e => state.tracker = e.target.checked;
panel.querySelector('#restart').onclick = () => { state.clock = 0; };
panel.querySelector('#motion').oninput = e => state.motion = +e.target.value;
panel.querySelector('#glass').oninput  = e => state.glass  = +e.target.value;
panel.querySelector('#speed').oninput  = e => state.speed  = +e.target.value;
const pauseBtn = panel.querySelector('#pause');
const togglePlay = () => { state.playing = !state.playing; pauseBtn.textContent = state.playing ? 'Pause' : 'Resume'; };
pauseBtn.onclick = togglePlay;
panel.querySelector('#png').onclick = () => {
  draw(breathAt(PATTERNS[state.pattern], state.clock)); const a = document.createElement('a'); a.download = 'breath.png'; a.href = canvas.toDataURL('image/png'); a.click();
};
const stylesEl = document.getElementById('styles'), guideEl = document.getElementById('guide');
function setStyle(name) {
  if (!STYLES[name]) return;
  state.style = name; guideEl.dataset.ink = STYLES[name].ink; guideEl.dataset.pos = STYLES[name].pos;
  for (const b of stylesEl.children) b.classList.toggle('active', b.dataset.style === name);
}
for (const [k, st] of Object.entries(STYLES)) {
  const b = document.createElement('button'); b.type = 'button'; b.dataset.style = k; b.textContent = st.label;
  b.onclick = () => setStyle(k); stylesEl.appendChild(b);
}
setStyle(state.style);
const toggleBtn = document.getElementById('toggle'), dockEl = document.getElementById('dock');
const setPanel = open => { panel.classList.toggle('hidden', !open); dockEl.classList.toggle('open', open); };
toggleBtn.onclick = () => setPanel(true);
panel.querySelector('#close').onclick = () => setPanel(false);
setPanel(false);   // the breath is the page; controls stay out of the way until asked for
addEventListener('keydown', e => {
  if (e.key === 'c' || e.key === 'C') setPanel(panel.classList.contains('hidden'));
  if (e.key === ' ') { e.preventDefault(); togglePlay(); }
  const n = '1234'.indexOf(e.key); if (n >= 0 && n < Object.keys(STYLES).length) setStyle(Object.keys(STYLES)[n]);
});
if (params.has('clean')) { dockEl.remove(); document.getElementById('hint').remove(); }

// ------------------------------------------------------- public API
window.art = {
  state, PALETTE, PATTERNS,
  setColors(map) { for (const k in map) if (k in PALETTE) { PALETTE[k] = map[k]; if (inputs[k]) inputs[k].value = map[k]; } setInk(); },
  setPattern(name) { if (PATTERNS[name]) { state.pattern = name; state.clock = 0; patternSel.value = name; } },
  addPattern(name, label, phases, shape) { PATTERNS[name] = { label, phases, shape }; patternSel.add(new Option(label, name)); },
  setStyle,
  setSpeed(v)  { state.speed = v; },
  setMotion(v) { state.motion = v; },
  setGlass(v)  { state.glass = v; },
  play()  { state.playing = true; },
  pause() { state.playing = false; },
  restart() { state.clock = 0; },
};
</script>
</body>
</html>

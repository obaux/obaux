<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Will's Move-Out Garage Sale — Closed</title>
<meta name="robots" content="noindex" />
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #ffffff;
    color: #111111;
    font-family: "Google Sans Flex", "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    text-align: center;
  }
  .card { max-width: 420px; }
  p.eyebrow {
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-size: 0.7rem;
    font-weight: 500;
    color: #6a6a6a;
    margin: 0 0 10px;
  }
  h1 {
    font-size: clamp(1.6rem, 5vw, 2.2rem);
    font-weight: 500;
    letter-spacing: -0.02em;
    margin: 0 0 14px;
    line-height: 1.15;
  }
  p.lede {
    color: #6a6a6a;
    font-size: 0.95rem;
    line-height: 1.55;
    margin: 0;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <p class="eyebrow">Minneapolis &amp; St. Paul</p>
      <h1>The garage sale has ended</h1>
      <p class="lede">Thanks to everyone who bid — every item found a home. Questions about a pickup or payment? Text Will.</p>
    </div>
  </div>
</body>
</html>

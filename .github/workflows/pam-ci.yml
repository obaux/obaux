name: PAM CI

# Scoped to pam/** so the garage sale Pages deploy is never triggered by this
# project, and vice versa.
on:
  push:
    paths: ['pam/**', '.github/workflows/pam-ci.yml']
  pull_request:
    paths: ['pam/**', '.github/workflows/pam-ci.yml']
  workflow_dispatch:

concurrency:
  group: pam-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: pam

jobs:
  checks:
    name: Types, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pam/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      # Covers the SMS safety gates, the dignity-language rules, locale parity,
      # the translation ledger (a reworded English string whose translations were
      # not answered fails here), the transparency contract, and the a11y
      # structure of every component. The web app's own unit tests ride along.
      - name: Unit tests
        run: pnpm --filter @pam/config --filter @pam/ui --filter @pam/web --filter @pam/site test

      # The design system as a package (dist/): tokens.css, fonts, compiled
      # components and types. Also fails if tokens.css has drifted from its
      # sources (packages/ui/scripts/tokens.mjs --check).
      - name: Build the design system (@pam/ui dist)
        run: pnpm --filter @pam/ui build

      # Deliberately not the real project. The browser checks stub the RPC
      # response, so the client only has to construct — pointing CI at the live
      # database would make a test suite depend on a network and a key, and
      # would tell us nothing the stub does not.
      - name: Build web
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://stub.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: stub-anon-key-for-ci
        run: pnpm --filter @pam/web build

      # The public site (D-433): a static export with no Supabase client, so it
      # needs no stub environment.
      - name: Build public site
        run: pnpm --filter @pam/site build

      # The public site is not covered by the app's Playwright suite (the
      # `a11y` job below), so it has its own: axe on every page of the built
      # site, light and dark, desktop and phone, plus no sideways scroll and no
      # overlapping header controls at 320px (apps/site/scripts/a11y.mjs).
      - name: Install Chromium for the public-site accessibility check
        run: pnpm --filter @pam/web exec playwright install --with-deps chromium

      - name: Accessibility (public site)
        run: node apps/site/scripts/a11y.mjs

      # The seven About Pam pages are not built until Will signs them
      # (apps/site/src/content/signed-off.json), so check them in a preview build,
      # drafts included, as they will be the day they are signed.
      - name: Accessibility (public site, About Pam in seven languages)
        run: |
          PAM_SITE_DRAFTS=1 pnpm --filter @pam/site build
          node apps/site/scripts/a11y.mjs

      - name: Check first-load JS against the §12 budget
        run: node scripts/check-bundle-budget.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: web-export
          path: pam/apps/web/out
          retention-days: 3

  database:
    name: Migrations and RLS
    runs-on: ubuntu-latest

    # The migrations need PostGIS for geography columns and pgcrypto for invite
    # codes, so the image has to carry both.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pam_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      # The image installs PostGIS into POSTGRES_DB (pam_test) in `public`
      # before any step runs, so 0001's `create extension ... with schema
      # extensions` skipped as "already exists" and 0002 failed on
      # `extensions.geography` — red on every branch from at least 21
      # September. A database made from template0 is one the image never
      # touched, the same blank slate the local throwaway cluster gives.
      - name: Create a clean database
        run: psql postgresql://postgres:postgres@localhost:5432/postgres -c 'create database pam_ci template template0'

      # This is the job that proves the §4.1 privacy promises hold: one test
      # user per role attempting cross-role reads (§13 Phase 7).
      - name: Apply migrations and run the RLS penetration suite
        env:
          PAM_TEST_DSN: postgresql://postgres:postgres@localhost:5432/pam_ci
        run: bash packages/db/scripts/test-db.sh

  a11y:
    name: Accessibility (browser)
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pam/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: web-export
          path: pam/apps/web/out

      - name: Install Chromium
        run: pnpm --filter @pam/web exec playwright install --with-deps chromium

      # §12 is build-blocking: any WCAG AA violation fails here, as do
      # undersized touch targets and horizontal overflow at 320px.
      - name: axe + layout checks
        run: pnpm --filter @pam/web test:a11y

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: pam/apps/web/playwright-report
          retention-days: 7
